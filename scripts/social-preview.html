<!doctype html>
<html lang="en">
<head>

<title>topopt social preview artwork</title>
<style>
@font-face { font-family: Manrope; src: url('fonts/manrope/Manrope-Variable.woff2'); font-weight: 200 800; }

.model { position: absolute; right: 32px; top: 32px; width: 470px; height: 566px; border-radius: 16px; overflow: hidden; }
.model img { position: absolute; height: 660px; width: 900px; max-width: none; left: -215px; top: -47px; }

</head>

<div class="copy"><div class="brand"><span class="mark">t.</span>topopt</div><p class="eyebrow">Agent First Generative Design</p><h1>Agent prompt to<br>optimized part</h1><div class="sub">Running locally</div><p class="footer">Open-source generative design for your AI agent.</p></div>
